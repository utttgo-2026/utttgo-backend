name: CI-1 Backend (local doubles)

on:
  pull_request:
    branches: [main]
  push:
    branches: ['feature/**', 'main']

# No cloud credentials, deployment, package publishing or write permissions.
permissions:
  contents: read

# Cancel obsolete runs of the SAME event. Never cancel a required PR with a push.
concurrency:
  group: ci-1-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # scan feature commits against main, including PR merge commits
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Identify CI evidence (no external service credentials)
        run: |
          mkdir -p ci-evidence
          printf 'CI-1 backend with local doubles only\nSHA: %s\nEvent: %s\nSDK: %s\n' \
            "$GITHUB_SHA" "$GITHUB_EVENT_NAME" "$(dotnet --version)" > ci-evidence/context.txt

      - name: Restore + NuGetAudit (mandatory, direct and transitive)
        run: python3 scripts/ci/nuget_audit.py

      - name: Verify format
        run: dotnet format UTTTGO.Backend.slnx --verify-no-changes --no-restore

      - name: Build Release
        run: dotnet build UTTTGO.Backend.slnx -c Release --no-restore

      - name: Unit tests (local doubles)
        run: dotnet test tests/UtttGo.UnitTests/UtttGo.UnitTests.csproj -c Release --no-build --logger 'trx;LogFileName=unit.trx' --results-directory "$RUNNER_TEMP/ci1-tests/unit"

      - name: Integration tests (local doubles, not external integrations)
        run: dotnet test tests/UtttGo.IntegrationTests/UtttGo.IntegrationTests.csproj -c Release --no-build --logger 'trx;LogFileName=integration.trx' --results-directory "$RUNNER_TEMP/ci1-tests/integration"

      - name: Security tests (local doubles, not distributed security)
        run: dotnet test tests/UtttGo.SecurityTests/UtttGo.SecurityTests.csproj -c Release --no-build --logger 'trx;LogFileName=security.trx' --results-directory "$RUNNER_TEMP/ci1-tests/security"

      - name: Summarize tests without uploading raw TRX
        if: always()
        run: python3 scripts/ci/test_summary.py "$RUNNER_TEMP/ci1-tests"

      - name: Secret scan (mandatory; no raw findings in logs or artifacts)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error --retry 2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" -o "$archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/ci1-bin" "$RUNNER_TEMP/ci1-tracked"
          tar -xzf "$archive" -C "$RUNNER_TEMP/ci1-bin" gitleaks
          scanner="$RUNNER_TEMP/ci1-bin/gitleaks"
          base=$(git merge-base HEAD origin/main)
          if [ -z "$base" ]; then
            printf 'Secret scan: FAIL (no trusted base)\n' > ci-evidence/secrets.txt
            exit 1
          fi
          # Archive only the committed tree, never bin/obj or ignored local files.
          git archive HEAD | tar -x -C "$RUNNER_TEMP/ci1-tracked"
          printf 'Secret scan: git commits plus tracked tree; Gitleaks %s\n' "$version" > ci-evidence/secrets.txt
          if ! "$scanner" git . --log-opts="$base..HEAD" --redact --no-banner > "$RUNNER_TEMP/gitleaks-git.log" 2>&1; then
            printf 'Secret scan: FAIL (commits; output withheld)\n' >> ci-evidence/secrets.txt
            exit 1
          fi
          if ! "$scanner" dir "$RUNNER_TEMP/ci1-tracked" --redact --no-banner > "$RUNNER_TEMP/gitleaks-tree.log" 2>&1; then
            printf 'Secret scan: FAIL (tracked tree; output withheld)\n' >> ci-evidence/secrets.txt
            exit 1
          fi
          printf 'Secret scan: PASS (both scans executed)\n' >> ci-evidence/secrets.txt

      - name: Upload safe CI evidence (no raw scanner output)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-1-backend-local-doubles
          path: ci-evidence/
          if-no-files-found: error
          retention-days: 7 # limited CI-only evidence; revisit with repository retention policy

  sast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # ensure origin/main is available for future baseline
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Semgrep (blocking, ERROR findings)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          # Ejecutar Semgrep y guardar el reporte sin baseline (Fase A: bloques si hay ERRORes)
          docker run --rm -v "$PWD:/src:ro" -w /src \
            semgrep/semgrep:1.183.0@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0 \
            semgrep scan --config .semgrep/ci-1.yaml --config p/csharp --metrics=off --json > ci-evidence/semgrep-raw.json 2> "$RUNNER_TEMP/semgrep-error.log"
          rc=$?
          python3 - "$RUNNER_TEMP/semgrep-error.log" "$?" <<'PY'
          import json, sys
          try:
              raw = Path(sys.argv[1]).read_text(encoding="utf-8")
              results = json.loads(raw)
              # Contar hallazgos ERROR (Fase A: bloqueante si hay ERRORes; sin baseline, todos son "nuevos")
              error_findings = [r for r in results.get("results", []) if r.get("severity") == "ERROR"]
              summary = {
                  "mode": "sast-blocking",
                  "total_findings": len(results.get("results", [])),
                  "new_ERRORs": len(error_findings),
                  "ruleIds": sorted({r["check_id"] for r in results.get("results", [])}),
              }
          except Exception:
              summary = {
                  "mode": "sast-blocking",
                  "total_findings": 0,
                  "new_ERRORs": 0,
                  "status": "scan-unavailable"
              }
          Path("ci-evidence/semgrep-summary.json").write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          print("SAST summary:", json.dumps(summary, indent=2))
          PY
      - name: Upload Semgrep summary (no raw JSON with code snippets)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-1-sast
          path: ci-evidence/semgrep-summary.json
          if-no-files-found: warn
          retention-days: 7

  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          # También instalaremos el runtime .NET 8.0 para Stryker si es necesario
      - name: Install Stryker globally
        run: dotnet tool install --global dotnet-stryker --version 5.1.0
        env:
          PATH: "$PATH:$HOME/.dotnet/tools"
      - name: Run Stryker mutation testing
        run: dotnet stryker
        env:
          # Asegurar que stryker.json en la raíz sea detectado
          # No se requieren variables de entorno adicionales
      - name: Publish mutation summary
        if: always()
        run: python3 scripts/ci/devsecops.py mutation --report ci-evidence/mutation-summary.json --threshold 50
      - name: Upload mutation summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-1-mutation
          path: ci-evidence/mutation-summary.json
          if-no-files-found: warn
          retention-days: 7

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and save API image
        run: |
          docker build -t utttgo/api:ci .
          docker save utttgo/api:ci | gzip > "$RUNNER_TEMP/api-image.tar.gz"
      - name: Dockle (error-level only = Alto/Crítico)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v $PWD/ci-evidence:/results \
            goodwithtech/dockle:v0.4.15@sha256:eade932f793742de0aa8755406c7677cd7696f8675b6180926f7eeffa7abe6b9 \
            utttgo/api:ci -f json -o /results/dockle-report.json -l ERROR -c 1
      - name: Publish Dockle summary
        if: always()
        run: python3 scripts/ci/devsecops.py dockle --report ci-evidence/dockle-summary.json
      - name: Upload Dockle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-1-container
          path: ci-evidence/dockle-report.json
          retention-days: 7

  dast:
    needs: container
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: utttgo
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: ci-dummy-anon-key
      SUPABASE_JWT_SECRET: ci-dummy-jwt-secret-0123456789abcdef0123456789abcdef
      SUPABASE_JWT_ISSUER: https://example.supabase.co
      SUPABASE_JWT_AUDIENCE: authenticated
      S3_BUCKET_IMAGES: utttgo-ci-dummy
      COMPOSE_PROFILES: local
    steps:
      - uses: actions/checkout@v4
      - name: Load API image and start stack
        env:
          MONGODB_URI: mongodb://mongo:27017
          MONGODB_DATABASE: utttgo
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: ci-dummy-anon-key
          SUPABASE_JWT_SECRET: ci-dummy-jwt-secret-0123456789abcdef0123456789abcdef
          SUPABASE_JWT_ISSUER: https://example.supabase.co
          SUPABASE_JWT_AUDIENCE: authenticated
          S3_BUCKET_IMAGES: utttgo-ci-dummy
          COMPOSE_PROFILES: local
        run: |
          docker load -i "$RUNNER_TEMP/api-image.tar.gz"
          docker tag utttgo/api:ci utttgo/api:0.1.0
          export COMPOSE_PROFILES=local
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --no-build --scale api=1
          # Poll health up to 120s
          for i in $(seq 1 24); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null 2>&1; then
              echo "Health OK"
              break
            fi
            echo "Waiting for health... ($i/24)"
            sleep 5
          fi
      - name: ZAP baseline + API scan
        run: |
          docker run --rm --network host -v "$PWD/ci-evidence:/zap/wrk" ghcr.io/zaproxy/zaproxy:stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af zap-baseline.py -t http://127.0.0.1:8080 -J zap-baseline.json -r zap-baseline.html -w zap-baseline.md -I 2>/dev/null || true
          docker run --rm --network host -v "$PWD/ci-evidence:/zap/wrk" ghcr.io/zaproxy/zaproxy:stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af zap-api-scan.py -t http://127.0.0.1:8080/openapi/v1.json -f openapi -J zap-api.json -r zap-api.html -w zap-api-warnings.md -I 2>/dev/null || true
      - name: Publish DAST summary
        if: always()
        run: python3 scripts/ci/devsecops.py dast --report ci-evidence/dast-summary.json
      - name: Compose down (acotado)
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v --remove-orphans
      - name: Upload DAST artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-1-dast
          path: ci-evidence/dast-summary.json
          retention-days: 7

  fuzz:
    needs: container
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: utttgo
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: ci-dummy-anon-key
      SUPABASE_JWT_SECRET: ci-dummy-jwt-secret-0123456789abcdef0123456789abcdef
      SUPABASE_JWT_ISSUER: https://example.supabase.co
      SUPABASE_JWT_AUDIENCE: authenticated
      S3_BUCKET_IMAGES: utttgo-ci-dummy
      COMPOSE_PROFILES: local
    steps:
      - uses: actions/checkout@v4
      - name: Load API image and start stack
        env:
          MONGODB_URI: mongodb://mongo:27017
          MONGODB_DATABASE: utttgo
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: ci-dummy-anon-key
          SUPABASE_JWT_SECRET: ci-dummy-jwt-secret-0123456789abcdef0123456789abcdef
          SUPABASE_JWT_ISSUER: https://example.supabase.co
          SUPABASE_JWT_AUDIENCE: authenticated
          S3_BUCKET_IMAGES: utttgo-ci-dummy
          COMPOSE_PROFILES: local
        run: |
          docker load -i "$RUNNER_TEMP/api-image.tar.gz"
          docker tag utttgo/api:ci utttgo/api:0.1.0
          export COMPOSE_PROFILES=local
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --no-build --scale api=1
          # Poll health up to 120s
          for i in $(seq 1 24); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null 2>&1; then
              echo "Health OK"
              break
            fi
            echo "Waiting for health... ($i/24)"
            sleep 5
          fi
      - name: RESTler compile + test + fuzz-lean
        run: |
          docker run --rm --network host -v "$PWD:/work" -w /work mcr.microsoft.com/restlerfuzzer/restler:v9.2.4@sha256:f37705fc4a11071f1de67ac4708fd97c71c1b4e5a0bc0f9c16c21028c0c41cbb dotnet /RESTler/restler/Restler.dll compile --api_spec openapi.json
          # test mode to verify connectivity
          docker run --rm --network host -v "$PWD:/work" -w /work mcr.microsoft.com/restlerfuzzer/restler:v9.2.4@sha256:f37705fc4a11071f1de67ac4708fd97c71c1b4e5a0bc0f9c16c21028c0c41cbb dotnet /RESTler/restler/Restler.dll test --url_host 127.0.0.1 --url_port 8080 --connection_timeout 10
          # fuzz-lean with time_budget 10 minutes
          docker run --rm --network host -v "$PWD:/work" -w /work mcr.microsoft.com/restlerfuzzer/restler:v9.2.4@sha256:f37705fc4a11071f1de67ac4708fd97c71c1b4e5a0bc0f9c16c21028c0c41cbb dotnet /RESTler/restler/Restler.dll fuzz-lean --time_budget 10
      - name: Publish fuzz summary
        if: always()
        run: python3 scripts/ci/devsecops.py restler --report ci-evidence/restler-summary.json
      - name: Compose down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v --remove-orphans
      - name: Upload fuzz artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-1-fuzz
          path: ci-evidence/restler-summary.json
          retention-days: 7

  quality-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: always()
    needs: [backend, sast, mutation, container, dast, fuzz]
    steps:
      - uses: actions/checkout@v4
      - name: Download all CI evidence artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ci-1-*
          merge-multiple: true
          root: ci-evidence/
      - name: Generate Hardening Report + step summary
        run: python3 scripts/ci/devsecops.py report \
          --outdir ci-evidence \
          --step-summary "$GITHUB_STEP_SUMMARY" \
          --artifact-root ci-evidence
      - name: Upload Hardening Report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-1-hardening-report
          path: ci-evidence/hardening-report.md
          retention-days: 7