name: Ops-Diagnose EC2 (solo lectura)

# Diagnostico manual del estado de la instancia EC2 de DEC-018 (3.129.142.54).
# Es de SOLO LECTURA: no modifica contenedores, imagenes, archivos ni
# configuracion. Se usa cuando el CD falla o el stack no responde.
#
# Ademas recupera el detalle de una invocacion SSM previa (Status,
# StatusDetails, stdout y stderr) para depurar un paso de despliegue fallido.
#
# Usa el mismo metodo de autenticacion que cd-deploy.yml (usuario IAM de
# privilegio minimo del repositorio, claves en los secretos AWS_ACCESS_KEY_ID
# y AWS_SECRET_ACCESS_KEY) y el mismo transporte (AWS Systems Manager,
# send-command). El puerto 22 del Security Group permanece cerrado (DEC-020).
on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo del diagnostico'
        required: true
        type: string
      command_id:
        description: 'CommandId SSM previo a inspeccionar (opcional)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ops-diagnose-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  DEPLOY_PATH: /opt/utttgo

jobs:
  diagnose:
    name: Diagnostico en la instancia (SSM, solo lectura)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Comprobar credenciales de AWS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "Faltan los secretos AWS_ACCESS_KEY_ID y/o AWS_SECRET_ACCESS_KEY del usuario IAM de despliegue." >&2
            exit 1
          fi
          aws sts get-caller-identity --query 'User.UserName' --output text

      - name: Motivo del diagnostico
        env:
          DIAGNOSE_REASON: ${{ inputs.reason }}
        run: |
          printf 'Motivo: %s\n' "$DIAGNOSE_REASON"

      - name: Identificar la instancia
        id: target
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          instance_id="$(aws ec2 describe-instances \
            --filters 'Name=tag:Project,Values=utttgo' \
                      'Name=tag:Environment,Values=dev' \
                      'Name=instance-state-name,Values=running' \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)"
          if [ -z "$instance_id" ] || [ "$instance_id" = "None" ]; then
            echo "No se encontro la instancia etiquetada Project=utttgo, Environment=dev en ejecucion." >&2
            exit 1
          fi
          echo "Instancia objetivo: $instance_id"
          echo "instance_id=$instance_id" >> "$GITHUB_OUTPUT"

      - name: Estado de la instancia por API (sin entrega SSM)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          INSTANCE_ID: ${{ steps.target.outputs.instance_id }}
        run: |
          set -euo pipefail
          instance_id="$INSTANCE_ID"

          echo "----- inventario SSM (PingStatus) -----"
          aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$instance_id" \
            --output json || echo "describe-instance-information no disponible"

          echo "----- comandos SSM recientes -----"
          aws ssm list-commands --max-results 5 --output json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps([{"CommandId":c.get("CommandId"),"Status":c.get("Status"),"StatusDetails":c.get("StatusDetails"),"DeliveryStatus":(c.get("DeliveryStatus") or {}).get("DeliveryStatus"),"TargetCount":c.get("TargetCount"),"RequestedDateTime":str(c.get("RequestedDateTime"))} for c in d.get("Commands",[])], indent=2))' \
            || echo "list-commands no disponible"

          echo "----- consola EC2 (ultimas lineas) -----"
          aws ec2 get-console-output --instance-id "$instance_id" --query Output --output text 2>/dev/null \
            | base64 -d 2>/dev/null | tail -n 60 \
            || echo "get-console-output no disponible"

          echo "----- ultimo evento de CloudWatch Logs -----"
          aws logs tail /utttgo/api/dev --since 12h --format short 2>/dev/null | tail -n 30 \
            || echo "CloudWatch Logs sin eventos o no disponible"

          echo "----- permisos de recuperacion (dry-run, NO ejecuta nada) -----"
          aws ec2 reboot-instances --instance-ids "$instance_id" --dry-run 2>&1 | tail -n 3 || true
          aws ec2 stop-instances --instance-ids "$instance_id" --dry-run 2>&1 | tail -n 3 || true
          aws ec2 start-instances --instance-ids "$instance_id" --dry-run 2>&1 | tail -n 3 || true

      - name: Detalle de la invocacion SSM previa
        if: inputs.command_id != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PREVIOUS_COMMAND_ID: ${{ inputs.command_id }}
          INSTANCE_ID: ${{ steps.target.outputs.instance_id }}
        run: |
          set -euo pipefail
          echo "----- invocacion $PREVIOUS_COMMAND_ID -----"
          aws ssm get-command-invocation \
            --command-id "$PREVIOUS_COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,StatusDetails:StatusDetails,Start:ExecutionStartDateTime,Elapsed:ExecutionElapsedTime,ExitCode:ExecutionEndDateTime}' \
            --output json || true
          echo "----- StandardOutputContent -----"
          aws ssm get-command-invocation \
            --command-id "$PREVIOUS_COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text || true
          echo "----- StandardErrorContent -----"
          aws ssm get-command-invocation \
            --command-id "$PREVIOUS_COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' \
            --output text || true
          echo "----- fin de la invocacion -----"

      - name: Recoger el estado de la instancia por SSM
        id: diagnose
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          INSTANCE_ID: ${{ steps.target.outputs.instance_id }}
        run: |
          set -euo pipefail
          instance_id="$INSTANCE_ID"

          # Todos los comandos son de lectura: no reinician ni recrean nada.
          python3 - <<'PY' > /tmp/ssm-diagnose.json
          import json

          commands = [
              "echo '=== df -h ==='",
              "df -h 2>&1 || true",
              "echo '=== df -i ==='",
              "df -i 2>&1 || true",
              "echo '=== free -m ==='",
              "free -m 2>&1 || true",
              "echo '=== uptime ==='",
              "uptime 2>&1 || true",
              "echo '=== docker ps -a ==='",
              "docker ps -a 2>&1 || true",
              "echo '=== docker system df ==='",
              "docker system df 2>&1 || true",
              "echo '=== docker compose ps ==='",
              "cd /opt/utttgo && docker compose ps 2>&1 || true",
              "echo '=== git rev-parse HEAD ==='",
              "git -C /opt/utttgo rev-parse HEAD 2>&1 || true",
              "echo '=== procesos dotnet / build ==='",
              "ps aux 2>/dev/null | grep -E 'dotnet|docker build|containerd' | grep -v grep | head -n 20 || true",
              "echo '=== agente SSM ==='",
              "systemctl is-active snap.amazon-ssm-agent 2>&1 || systemctl is-active amazon-ssm-agent 2>&1 || true",
              "echo '=== ultimos eventos del agente SSM ===",
              "journalctl -u snap.amazon-ssm-agent -u amazon-ssm-agent --no-pager -n 40 2>&1 || tail -n 40 /var/log/amazon/ssm/ssm-agent.log 2>&1 || true",
              "echo '=== docker compose logs --tail=40 ==='",
              "cd /opt/utttgo && docker compose logs --tail=40 2>&1 || true",
              "echo '=== aws logs tail /utttgo/api/dev (si el driver awslogs impide leer compose logs) ==='",
              "if command -v aws >/dev/null 2>&1; then aws logs tail /utttgo/api/dev --since 30m --format short 2>&1 | tail -n 50 || true; else echo 'aws cli no disponible en la instancia'; fi",
          ]
          print(json.dumps({"commands": commands}))
          PY

          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --targets "Key=instanceids,Values=$instance_id" \
            --parameters file:///tmp/ssm-diagnose.json \
            --timeout-seconds 420 \
            --query 'Command.CommandId' \
            --output text)"
          echo "Comando SSM: $command_id"
          rm -f /tmp/ssm-diagnose.json

          # El bucle (35 vueltas de 10 s = 350 s) termina antes que el limite
          # del comando (420 s) y que el limite del job (10 min).
          status="Pending"
          for _ in $(seq 1 35); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$instance_id" \
              --query 'Status' \
              --output text)"
            case "$status" in
              Success|Cancelled|Failed|TimedOut|AccessDenied|InvalidCommand) break ;;
            esac
            sleep 10
          done

          echo "----- salida del diagnostico -----"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$instance_id" \
            --query 'StandardOutputContent' \
            --output text
          echo "----- fin de la salida -----"

          if [ "$status" != "Success" ]; then
            echo "El comando SSM termino con estado $status" >&2
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$instance_id" \
              --query 'StandardErrorContent' \
              --output text >&2 || true
            exit 1
          fi
