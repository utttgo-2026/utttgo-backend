name: CD-Deploy Backend (EC2)

# Despliegue controlado hacia la EC2 de DEC-018 (3.129.142.54).
# Se ejecuta SOLO después de que CI-1 termine en verde sobre el mismo push a main.
#
# El despliegue usa AWS Systems Manager (send-command). El puerto 22 del Security
# Group permanece cerrado (DEC-020).
#
# El SCP de la organizacion deniega iam:CreateOpenIDConnectProvider, por lo que
# GitHub Actions no puede autenticarse en AWS por OIDC en esta cuenta. CD-1 usa un
# usuario IAM de privilegio minimo (utttgo-dev-github-actions-deploy) cuya clave
# vive en los secretos AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY del repositorio.
on:
  workflow_run:
    workflows: ['CI-1 Backend (local doubles)']
    types: [completed]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo del despliegue manual a la EC2'
        required: true
        type: string

# contents: read para leer el repositorio. No se requiere id-token: OIDC esta
# bloqueado por el SCP de la organizacion.
permissions:
  contents: read

# Nunca cancelar un despliegue en curso: dos despliegues simultaneos se contradicen.
concurrency:
  group: cd-deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  SSM_DEPLOY_DOCUMENT: utttgo-dev-deploy
  API_BASE_URL: http://3.129.142.54
  TLS_BASE_URL: https://3.129.142.54.nip.io

jobs:
  gate:
    name: Gate (CI-1 verde y despliegue autorizado)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      target_sha: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Resumen del gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DEPLOY_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          printf 'Evento: %s\n' "$EVENT_NAME"
          printf 'SHA objetivo: %s\n' "$TARGET_SHA"
          if [ "$EVENT_NAME" = 'workflow_run' ]; then
            printf 'CI-1: %s (evento %s sobre %s)\n' "$RUN_CONCLUSION" "$RUN_EVENT" "$RUN_HEAD_BRANCH"
          fi
          if [ -n "$DEPLOY_REASON" ]; then
            printf 'Motivo: %s\n' "$DEPLOY_REASON"
          fi

  deploy:
    name: Despliegue en EC2 (SSM send-command)
    needs: gate
    runs-on: ubuntu-24.04
    # El build de la imagen ocurre en la instancia t3.micro (CPU credits
    # agotados): la publicacion de .NET puede tardar ~30 min. El limite cubre
    # build + arranque + sondas sin cortar el despliegue a mitad.
    timeout-minutes: 75
    environment:
      name: production
      url: https://3.129.142.54
    steps:
      - name: Comprobar credenciales de AWS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "Faltan los secretos AWS_ACCESS_KEY_ID y/o AWS_SECRET_ACCESS_KEY del usuario IAM de despliegue." >&2
            echo "Crealos segun infra/terraform/README.md (iam:create-access-key) y guardalos en Settings > Secrets and variables > Actions." >&2
            exit 1
          fi
          aws sts get-caller-identity --query 'User.UserName' --output text

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.target_sha }}

      # El documento SSM incrusta infra/ssm/deploy.sh con file() (main.tf):
      # sin terraform apply el CD ejecuta un script antiguo y las partes nuevas
      # (p. ej. el aprovisionamiento TLS) se omiten en silencio. El 2026-11-12
      # esto dejo la API sin TLS (443 sin servidor) con un run de CD en verde.
      - name: Verificar sincronia del documento SSM
        id: ssm_doc
        env:
          SSM_DOCUMENT: ${{ env.SSM_DEPLOY_DOCUMENT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          doc="$(aws ssm get-document \
            --name "$SSM_DOCUMENT" \
            --query Content \
            --output text)"
          printf '%s' "$doc" | python3 -c 'import json,sys; sys.stdout.write(json.load(sys.stdin)["mainSteps"][0]["inputs"]["runCommand"][0])' > /tmp/ssm-embedded-deploy.sh
          if diff -u --label "repositorio: infra/ssm/deploy.sh" --label "documento SSM incrustado" \
              infra/ssm/deploy.sh /tmp/ssm-embedded-deploy.sh > /tmp/ssm-doc.diff; then
            echo "Documento SSM sincronizado con infra/ssm/deploy.sh."
            echo "synced=true" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/ssm-doc.diff
            echo "::error::El documento SSM '$SSM_DOCUMENT' esta desactualizado: su script incrustado no coincide con infra/ssm/deploy.sh. CD-1 se detiene para no desplegar con un script antiguo (asi el TLS no se aprovisiono el 2026-11-12). Solucion: con credenciales del propietario ejecutar 'terraform -chdir=infra/terraform apply' (main.tf incrusta el script con file()) y volver a disparar CD-1."
            exit 1
          fi

      - name: Desplegar en la EC2 por Systems Manager
        id: deploy
        env:
          TARGET_SHA: ${{ needs.gate.outputs.target_sha }}
          SSM_DOCUMENT: ${{ env.SSM_DEPLOY_DOCUMENT }}
          API_BASE: ${{ env.API_BASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          instance_id="$(aws ec2 describe-instances \
            --filters 'Name=tag:Project,Values=utttgo' \
                      'Name=tag:Environment,Values=dev' \
                      'Name=instance-state-name,Values=running' \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)"
          if [ -z "$instance_id" ] || [ "$instance_id" = "None" ]; then
            echo "No se encontro la instancia etiquetada Project=utttgo, Environment=dev en ejecucion." >&2
            exit 1
          fi
          echo "Instancia objetivo: $instance_id"

          # El CLI de AWS exige que el valor de cada parametro de
          # `--parameters` sea una lista JSON: `sha=["<sha>"]`. Un valor simple
          # se rechaza antes de enviar el comando con
          # "Invalid type for parameter Parameters.sha ... valid types: list".
          # El repositorio es publico: el fetch en la instancia no lleva
          # credenciales. Si pasa a privado, se envia GITHUBTOKEN como parametro
          # del documento (cabecera extra de git, nunca se escribe en disco).
          parameters="sha=[\"$TARGET_SHA\"]"
          echo "Parametros SSM: $parameters"
          command_id="$(aws ssm send-command \
            --document-name "$SSM_DOCUMENT" \
            --targets "Key=instanceids,Values=$instance_id" \
            --parameters "$parameters" \
            --timeout-seconds 5400 \
            --query 'Command.CommandId' \
            --output text)"
          echo "Comando SSM: $command_id"

          status="Pending"
          for _ in $(seq 1 540); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$instance_id" \
              --query 'Status' \
              --output text)"
            case "$status" in
              Success|Cancelled|Failed|TimedOut|AccessDenied|InvalidCommand) break ;;
            esac
            sleep 10
          done

          echo "----- salida del comando -----"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$instance_id" \
            --query 'StandardOutputContent' \
            --output text
          echo "----- fin de la salida -----"

          if [ "$status" != "Success" ]; then
            echo "El comando SSM termino con estado $status" >&2
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$instance_id" \
              --query 'StandardErrorContent' \
              --output text >&2 || true
            exit 1
          fi

          # GITHUB_OUTPUT solo existe en el runner: la sonda se consulta desde aqui.
          health_code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$API_BASE/health" || echo 000)"
          health_code="${health_code:-000}"
          echo "Sonda /health registrada: $health_code"
          echo "health_code=$health_code" >> "$GITHUB_OUTPUT"

      # Verifica desde fuera de la instancia lo que el equipo movil consume:
      # TLS real de Let's Encrypt para el hostname nip.io (sin -k: la cadena
      # debe ser valida). Fallo no bloqueante: el despliegue ya esta activo en
      # HTTP y provision-tls.sh es best-effort por diseno.
      - name: Smoke HTTPS publico
        id: https_smoke
        if: steps.deploy.outcome == 'success'
        env:
          TLS_BASE: ${{ env.TLS_BASE_URL }}
        run: |
          set -euo pipefail
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$TLS_BASE/health" || echo 000)"
          code="${code:-000}"
          echo "HTTPS $TLS_BASE/health -> $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            200|503) ;;
            *) echo "::warning::HTTPS no responde ($code): certificado ausente, fallo de provision-tls.sh o SKIP_TLS=1 en el .env. Revisa la salida del despliegue y 'terraform apply'." ;;
          esac

      - name: Evidencia de despliegue
        if: always()
        env:
          TARGET_SHA: ${{ needs.gate.outputs.target_sha }}
          API_BASE: ${{ env.API_BASE_URL }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          HEALTH_STATUS: ${{ steps.deploy.outputs.health_code }}
          DOC_SYNC: ${{ steps.ssm_doc.outcome }}
          HTTPS_STATUS: ${{ steps.https_smoke.outputs.code }}
          LOG_GROUP: /utttgo/api/dev
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          {
            printf 'CD backend UTTT-GO\n'
            printf 'Transporte: AWS Systems Manager (send-command) con usuario IAM de privilegio minimo\n'
            printf 'SHA objetivo: %s\n' "$TARGET_SHA"
            printf 'API: %s\n' "$API_BASE"
            printf 'Resultado: %s\n' "$DEPLOY_OUTCOME"
            printf 'Sonda /health: %s\n' "${HEALTH_STATUS:-no ejecutada}"
            printf 'Documento SSM sincronizado: %s\n' "${DOC_SYNC:-no ejecutada}"
            printf 'HTTPS /health: %s\n' "${HTTPS_STATUS:-no ejecutada}"
            printf 'Fecha UTC: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > ci-evidence/cd-deploy.txt

          # Los logs de los contenedores se publican en CloudWatch Logs con el
          # driver awslogs de Docker; el runner los consulta para la evidencia.
          if [ -n "${AWS_ACCESS_KEY_ID:-}" ] && [ -n "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            {
              printf '\nUltimos eventos de %s:\n' "$LOG_GROUP"
              aws logs tail "$LOG_GROUP" --since 10m --format short 2>/dev/null | tail -n 40 || true
            } >> ci-evidence/cd-deploy.txt
          fi

      - name: Subir evidencia (sin secretos ni logs crudos)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cd-deploy-${{ needs.gate.outputs.target_sha }}
          path: ci-evidence/
          if-no-files-found: error
          retention-days: 7
