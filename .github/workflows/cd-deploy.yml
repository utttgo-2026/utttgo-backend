name: CD-Deploy Backend (EC2)

# Despliegue controlado hacia la EC2 de DEC-018 (3.129.142.54).
# Se ejecuta SOLO después de que CI-1 termine en verde sobre el mismo push a main.
#
# Desde 2026-11-18 (DEC-022) la imagen se construye en GitHub Actions y se
# publica en GHCR con el tag del commit: la instancia solo hace
# "docker compose pull api && docker compose up -d --no-build". El build de
# .NET en la t3.micro (1 vCPU / 1 GiB) tardaba ~29-45 min y hacia fallar el
# despliegue por timeout (run 44255395753).
#
# El despliegue usa AWS Systems Manager (send-command con AWS-RunShellScript y
# el contenido de infra/ssm/deploy.sh del commit objetivo). El puerto 22 del
# Security Group permanece cerrado (DEC-020).
#
# El SCP de la organizacion deniega iam:CreateOpenIDConnectProvider, por lo que
# GitHub Actions no puede autenticarse en AWS por OIDC en esta cuenta. CD-1 usa un
# usuario IAM de privilegio minimo (utttgo-dev-github-actions-deploy) cuya clave
# vive en los secretos AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY del repositorio.
on:
  workflow_run:
    workflows: ['CI-1 Backend (local doubles)']
    types: [completed]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo del despliegue manual a la EC2'
        required: true
        type: string

# contents: read para leer el repositorio. No se requiere id-token: OIDC esta
# bloqueado por el SCP de la organizacion. packages: write solo en el job que
# publica la imagen en GHCR.
permissions:
  contents: read

# Nunca cancelar un despliegue en curso: dos despliegues simultaneos se contradicen.
concurrency:
  group: cd-deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  API_BASE_URL: http://3.129.142.54
  TLS_BASE_URL: https://3.129.142.54.nip.io
  GHCR_IMAGE: ghcr.io/utttgo-2026/utttgo-api

jobs:
  gate:
    name: Gate (CI-1 verde y despliegue autorizado)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      target_sha: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Resumen del gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          DEPLOY_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          printf 'Evento: %s\n' "$EVENT_NAME"
          printf 'SHA objetivo: %s\n' "$TARGET_SHA"
          if [ "$EVENT_NAME" = 'workflow_run' ]; then
            printf 'CI-1: %s (evento %s sobre %s)\n' "$RUN_CONCLUSION" "$RUN_EVENT" "$RUN_HEAD_BRANCH"
          fi
          if [ -n "$DEPLOY_REASON" ]; then
            printf 'Motivo: %s\n' "$DEPLOY_REASON"
          fi

  build_image:
    name: Construir y publicar imagen (GHCR)
    needs: gate
    runs-on: ubuntu-24.04
    # El build de .NET corre en el runner (2 vCPU / 7 GiB), no en la EC2.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tag.outputs.image }}
      needs_token: ${{ steps.publish.outputs.needs_token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.target_sha }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Autenticar en GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen por commit
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ needs.gate.outputs.target_sha }}
            ${{ env.GHCR_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Exponer el tag de la imagen publicada
        id: tag
        run: echo "image=${GHCR_IMAGE}:${{ needs.gate.outputs.target_sha }}" >> "$GITHUB_OUTPUT"

      # Si el paquete de GHCR es publico, la instancia descarga sin credenciales.
      # Si es privado, el deploy usa un token de solo lectura (nunca impreso).
      - name: Visibilidad del paquete en GHCR
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          visibility="desconocida"
          if response="$(gh api "/orgs/utttgo-2026/packages/container/utttgo-api" 2>/dev/null)"; then
            visibility="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("visibility","desconocida"))')"
          fi
          printf 'Visibilidad del paquete GHCR: %s\n' "$visibility"
          if [ "$visibility" != "public" ]; then
            echo "::warning::El paquete no es publico: la instancia usara un token de solo lectura para descargar la imagen."
          fi
          echo "needs_token=$([ "$visibility" = "public" ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Despliegue en EC2 (SSM send-command)
    needs: [gate, build_image]
    runs-on: ubuntu-24.04
    # Sin build en la instancia: descarga, arranque y sondas. 30 min deja
    # margen sobre el limite de 25 min del comando SSM.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://3.129.142.54
    steps:
      - name: Comprobar credenciales de AWS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "Faltan los secretos AWS_ACCESS_KEY_ID y/o AWS_SECRET_ACCESS_KEY del usuario IAM de despliegue." >&2
            exit 1
          fi
          aws sts get-caller-identity --query 'User.UserName' --output text

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.gate.outputs.target_sha }}

      - name: Desplegar en la EC2 por Systems Manager
        id: deploy
        env:
          TARGET_SHA: ${{ needs.gate.outputs.target_sha }}
          API_IMAGE: ${{ needs.build_image.outputs.image }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ needs.build_image.outputs.needs_token == 'true' && secrets.GITHUB_TOKEN || '' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          instance_id="$(aws ec2 describe-instances \
            --filters 'Name=tag:Project,Values=utttgo' \
                      'Name=tag:Environment,Values=dev' \
                      'Name=instance-state-name,Values=running' \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)"
          if [ -z "$instance_id" ] || [ "$instance_id" = "None" ]; then
            echo "No se encontro la instancia etiquetada Project=utttgo, Environment=dev en ejecucion." >&2
            exit 1
          fi
          echo "Instancia objetivo: $instance_id"

          # El script se envia como AWS-RunShellScript con el contenido de
          # infra/ssm/deploy.sh del commit objetivo: el estado del documento
          # SSM de Terraform deja de ser una dependencia del despliegue.
          # El token de GHCR (si el paquete es privado) viaja dentro del
          # comando y nunca se imprime en el log.
          python3 - <<'PY' > /tmp/ssm-parameters.json
          import json
          import os
          import pathlib

          script = pathlib.Path("infra/ssm/deploy.sh").read_text(encoding="utf-8")
          prefix = [
              "export DEPLOY_SHA='{}'".format(os.environ["TARGET_SHA"]),
              "export API_IMAGE='{}'".format(os.environ["API_IMAGE"]),
          ]
          token = os.environ.get("GHCR_TOKEN", "")
          if token:
              username = os.environ.get("GHCR_USERNAME", "utttgo-2026")
              prefix.append("export GHCR_USERNAME='{}'".format(username.replace("'", "'\\''")))
              prefix.append("export GHCR_TOKEN='{}'".format(token.replace("'", "'\\''")))
          payload = "\n".join(prefix) + "\n" + script
          print(json.dumps({"commands": [payload]}))
          PY
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --targets "Key=instanceids,Values=$instance_id" \
            --parameters file:///tmp/ssm-parameters.json \
            --timeout-seconds 1500 \
            --query 'Command.CommandId' \
            --output text)"
          echo "Comando SSM: $command_id"
          rm -f /tmp/ssm-parameters.json

          # El bucle termina antes que el limite del comando (1500 s) y antes
          # que el limite del job (30 min): 140 vueltas de 10 s = 1400 s.
          status="Pending"
          for _ in $(seq 1 140); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$instance_id" \
              --query 'Status' \
              --output text)"
            case "$status" in
              Success|Cancelled|Failed|TimedOut|AccessDenied|InvalidCommand) break ;;
            esac
            sleep 10
          done

          echo "----- salida del comando -----"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$instance_id" \
            --query 'StandardOutputContent' \
            --output text
          echo "----- fin de la salida -----"

          if [ "$status" != "Success" ]; then
            echo "El comando SSM termino con estado $status" >&2
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$instance_id" \
              --query 'StandardErrorContent' \
              --output text >&2 || true
            exit 1
          fi

          # SHA real del checkout desplegado en la instancia.
          deployed_sha="$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$instance_id" \
            --query 'StandardOutputContent' \
            --output text | grep -Eo '[0-9a-f]{40}' | tail -n 1 || true)"
          echo "SHA desplegado en la instancia: ${deployed_sha:-desconocido}"
          echo "deployed_sha=${deployed_sha:-}" >> "$GITHUB_OUTPUT"

          # La sonda operativa del backend es GET /health (no /api/v1/health).
          health_code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$API_BASE_URL/health" || echo 000)"
          health_code="${health_code:-000}"
          echo "Sonda /health registrada: $health_code"
          echo "health_code=$health_code" >> "$GITHUB_OUTPUT"
          case "$health_code" in
            200) ;;
            503) echo "::warning::La sonda /health devolvio 503: MongoDB o Redis no responden." ;;
            *) echo "::error::La sonda /health devolvio $health_code."; exit 1 ;;
          esac

      # Verifica desde fuera de la instancia lo que el equipo movil consume:
      # TLS real de Let's Encrypt para el hostname nip.io (sin -k: la cadena
      # debe ser valida). Fallo no bloqueante: el despliegue ya esta activo en
      # HTTP y provision-tls.sh es best-effort por diseno.
      - name: Smoke HTTPS publico
        id: https_smoke
        if: steps.deploy.outcome == 'success'
        env:
          TLS_BASE: ${{ env.TLS_BASE_URL }}
        run: |
          set -euo pipefail
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$TLS_BASE/health" || echo 000)"
          code="${code:-000}"
          echo "HTTPS $TLS_BASE/health -> $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            200|503) ;;
            *) echo "::warning::HTTPS no responde ($code): certificado ausente, fallo de provision-tls.sh o SKIP_TLS=1 en el .env. Revisa la salida del despliegue y 'terraform apply'." ;;
          esac

      - name: Evidencia de despliegue
        if: always()
        env:
          TARGET_SHA: ${{ needs.gate.outputs.target_sha }}
          API_IMAGE: ${{ needs.build_image.outputs.image }}
          API_BASE: ${{ env.API_BASE_URL }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOYED_SHA: ${{ steps.deploy.outputs.deployed_sha }}
          HEALTH_STATUS: ${{ steps.deploy.outputs.health_code }}
          HTTPS_STATUS: ${{ steps.https_smoke.outputs.code }}
          LOG_GROUP: /utttgo/api/dev
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ci-evidence
          {
            printf 'CD backend UTTT-GO\n'
            printf 'Transporte: AWS Systems Manager (send-command) con usuario IAM de privilegio minimo\n'
            printf 'SHA objetivo: %s\n' "$TARGET_SHA"
            printf 'SHA desplegado (git rev-parse HEAD en la instancia): %s\n' "${DEPLOYED_SHA:-no verificable}"
            printf 'Imagen: %s\n' "${API_IMAGE:-no publicada}"
            printf 'API: %s\n' "$API_BASE"
            printf 'Resultado: %s\n' "$DEPLOY_OUTCOME"
            printf 'Sonda /health: %s\n' "${HEALTH_STATUS:-no ejecutada}"
            printf 'HTTPS /health: %s\n' "${HTTPS_STATUS:-no ejecutada}"
            printf 'Fecha UTC: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > ci-evidence/cd-deploy.txt

          # Los logs de los contenedores se publican en CloudWatch Logs con el
          # driver awslogs de Docker; el runner los consulta para la evidencia.
          if [ -n "${AWS_ACCESS_KEY_ID:-}" ] && [ -n "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            {
              printf '\nUltimos eventos de %s:\n' "$LOG_GROUP"
              aws logs tail "$LOG_GROUP" --since 10m --format short 2>/dev/null | tail -n 40 || true
            } >> ci-evidence/cd-deploy.txt
          fi

      - name: Subir evidencia (sin secretos ni logs crudos)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cd-deploy-${{ needs.gate.outputs.target_sha }}
          path: ci-evidence/
          if-no-files-found: error
          retention-days: 7
